<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>GridShift-AI</title>
    <script>
      // Redirect all 404s back to the SPA root with the path preserved
      // so React Router can handle it on the client side
      var path = window.location.pathname;
      var search = window.location.search;
      window.location.replace('/?redirect=' + encodeURIComponent(path + search));
    </script>
  </head>
  <body></body>
</html>
